<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View change failover · Sequence</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · SuperVSR</p>
    <h1>View change when Primary 0 fails</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="view-change-title view-change-desc">
        <title id="view-change-title">View change when Primary 0 fails</title>
        <desc id="view-change-desc">Sequence diagram showing Replica 1 and Replica 2 exchanging ExitView, persisting view 1 to their superblocks, sending JoinView with header suffixes and bitmasks, selecting the canonical log, and broadcasting View to install view 1.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
          </marker>
          <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Lifelines at x = 160, 480, 784 -->
        <line x1="160" y1="108" x2="160" y2="564" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="480" y1="108" x2="480" y2="564" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="784" y1="108" x2="784" y2="564" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- Phase bands (left margin eyebrows, quiet rules) -->
        <line x1="40" y1="264" x2="920" y2="264" stroke="rgba(45,49,66,0.08)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="40" y1="416" x2="920" y2="416" stroke="rgba(45,49,66,0.08)" stroke-width="1" stroke-dasharray="3,3"/>

        <text x="40" y="136" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">01 EXIT</text>
        <text x="40" y="284" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">02 JOIN</text>
        <text x="40" y="436" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">03 INSTALL</text>

        <!-- Activation bars -->
        <rect x="476" y="156" width="8" height="388" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="780" y="156" width="8" height="352" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

        <!-- Messages -->
        <!-- 1. R2 -> R1: ExitView (view 0) -->
        <line x1="780" y1="164" x2="484" y2="164" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- 2. R1 self-loop: persist durableView = 1 -->
        <path d="M 484,196 H 532 Q 540,196 540,204 V 220 Q 540,228 532,228 H 484" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- 3. R2 self-loop: persist durableView = 1 -->
        <path d="M 788,196 H 828 Q 836,196 836,204 V 220 Q 836,228 828,228 H 788" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- 4. R2 -> R1: JoinView (headers + present/nack masks) -->
        <line x1="780" y1="308" x2="484" y2="308" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- 5. R1 self-loop: select canonical suffix (Qn truncation, repair gaps) -->
        <path d="M 484,344 H 532 Q 540,344 540,352 V 372 Q 540,380 532,380 H 484" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- 6. R1 self-loop: persist logView = 1 -->
        <path d="M 484,432 H 532 Q 540,432 540,440 V 456 Q 540,464 532,464 H 484" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- 7. R1 -> R2: View (canonical suffix + checkpoint, focal coral) -->
        <line x1="484" y1="504" x2="780" y2="504" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- 8. R1 -> R0: View (async catch-up when R0 recovers) -->
        <line x1="476" y1="540" x2="160" y2="540" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>

        <!-- Labels -->
        <g font-family="'Geist Mono', ui-monospace, monospace" font-size="8" text-anchor="middle" letter-spacing="0.06em">
          <rect x="572" y="144" width="120" height="12" rx="2" fill="#f5f5f5"/>
          <text x="632" y="153" fill="#5a6580">EXIT_VIEW (QV=2)</text>

          <rect x="548" y="206" width="132" height="12" rx="2" fill="#f5f5f5"/>
          <text x="552" y="215" fill="#5a6580" text-anchor="start">SYNC VIEW=1 TO DISK</text>

          <rect x="844" y="206" width="76" height="12" rx="2" fill="#f5f5f5"/>
          <text x="848" y="215" fill="#5a6580" text-anchor="start">SYNC VIEW=1</text>

          <rect x="556" y="288" width="152" height="12" rx="2" fill="#f5f5f5"/>
          <text x="632" y="297" fill="#5a6580">JOIN_VIEW (SUFFIX)</text>

          <rect x="548" y="356" width="136" height="12" rx="2" fill="#f5f5f5"/>
          <text x="552" y="365" fill="#5a6580" text-anchor="start">PICK CANONICAL LOG</text>

          <rect x="548" y="442" width="120" height="12" rx="2" fill="#f5f5f5"/>
          <text x="552" y="451" fill="#5a6580" text-anchor="start">SYNC LOGVIEW=1</text>

          <rect x="564" y="484" width="136" height="12" rx="2" fill="#f5f5f5"/>
          <text x="632" y="493" fill="#bf4520">VIEW (NORMAL V1)</text>

          <rect x="252" y="520" width="132" height="12" rx="2" fill="#f5f5f5"/>
          <text x="318" y="529" fill="#5a6580">VIEW ON RECOVERY</text>
        </g>

        <!-- Actor boxes -->
        <!-- R0: Failed primary (dashed optional treatment) -->
        <rect x="76" y="48" width="168" height="60" rx="6" fill="#f5f5f5"/>
        <rect x="76" y="48" width="168" height="60" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.28)" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="84" y="56" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.28)" stroke-width="0.8"/>
        <text x="106" y="65" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">FAILED</text>
        <text x="160" y="84" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Replica 0</text>
        <text x="160" y="99" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">old primary · view 0</text>

        <!-- R1: New primary (FOCAL CORAL) -->
        <rect x="392" y="48" width="176" height="60" rx="6" fill="#f5f5f5"/>
        <rect x="392" y="48" width="176" height="60" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="400" y="56" width="60" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="430" y="65" fill="#bf4520" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">NEW LEADER</text>
        <text x="480" y="84" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Replica 1</text>
        <text x="480" y="99" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">primary(1) = 1 % 3</text>

        <!-- R2: Active backup -->
        <rect x="700" y="48" width="168" height="60" rx="6" fill="#f5f5f5"/>
        <rect x="700" y="48" width="168" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="708" y="56" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="728" y="65" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">VOTER</text>
        <text x="784" y="84" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Replica 2</text>
        <text x="784" y="99" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">active backup</text>

        <!-- Legend strip -->
        <line x1="40" y1="584" x2="920" y2="584" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="604" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="616" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="60" y="624" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">New primary</text>

        <rect x="172" y="616" width="14" height="10" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.28)" stroke-width="1" stroke-dasharray="3,2"/>
        <text x="192" y="624" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Offline / recovering</text>

        <line x1="340" y1="621" x2="368" y2="621" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="376" y="624" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">View-change step</text>

        <line x1="512" y1="621" x2="540" y2="621" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="548" y="624" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Canonical view installed</text>

        <line x1="720" y1="621" x2="748" y2="621" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
        <text x="756" y="624" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Late recovery catch-up</text>
      </svg>
    </div>
  </div>
</body>
</html>
