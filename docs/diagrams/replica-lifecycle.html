<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Replica status transitions · State machine</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State machine · SuperVSR</p>
    <h1>Replica status transitions</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="replica-lifecycle-title replica-lifecycle-desc">
        <title id="replica-lifecycle-title">Replica status transitions</title>
        <desc id="replica-lifecycle-desc">State machine showing how a SuperVSR replica moves among StatusRecovering, StatusNormal, StatusViewChange, and StatusRecoveringHead during startup, failover, repair, and state sync.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
          </marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Transitions (drawn before boxes) -->
        <!-- 1. Start -> StatusRecovering -->
        <line x1="164" y1="140" x2="164" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- 2. StatusRecovering -> StatusNormal (WAL ready / sync complete) -->
        <path d="M 196,200 V 104 Q 196,96 204,96 H 384" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- 3. StatusNormal -> StatusRecovering (lagging checkpoint / state sync) -->
        <path d="M 384,132 H 240 Q 232,132 232,140 V 200" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- 4. StatusRecovering -> StatusRecoveringHead (uncertain head) -->
        <path d="M 164,284 V 364 Q 164,372 172,372 H 384" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- 5. StatusRecoveringHead -> StatusNormal (suffix repaired) -->
        <line x1="464" y1="332" x2="464" y2="152" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- 6. StatusNormal -> StatusRecoveringHead (gap observed) -->
        <line x1="520" y1="152" x2="520" y2="332" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- 7. StatusRecovering -> StatusViewChange (hops cleanly over the two center verticals at x=464 and x=520) -->
        <path d="M 264,244 H 456 a 8,8 0 0,1 16,0 H 512 a 8,8 0 0,1 16,0 H 672" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- 8. StatusNormal -> StatusViewChange (timeout or higher view) -->
        <path d="M 600,96 H 788 Q 796,96 796,104 V 200" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- 9. StatusViewChange -> StatusNormal (canonical view installed, focal coral) -->
        <path d="M 744,200 V 140 Q 744,132 736,132 H 600" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- 10. StatusViewChange -> StatusRecoveringHead (missing canonical suffix) -->
        <path d="M 744,284 V 348 Q 744,356 736,356 H 600" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- 11. StatusRecoveringHead -> StatusViewChange (stalled repair rejoins view change) -->
        <path d="M 600,388 H 788 Q 796,388 796,380 V 284" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- 12. StatusViewChange self-loop (higher view change) -->
        <path d="M 868,228 H 896 Q 904,228 904,236 V 252 Q 904,260 896,260 H 868" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- Transition labels (every mask 6-10px clear of its stroke, never touching a box) -->
        <g font-family="'Geist Mono', ui-monospace, monospace" font-size="8" text-anchor="middle" letter-spacing="0.06em">
          <rect x="120" y="160" width="36" height="12" rx="2" fill="#f5f5f5"/>
          <text x="138" y="169" fill="#5a6580">OPEN</text>

          <rect x="248" y="76" width="76" height="12" rx="2" fill="#f5f5f5"/>
          <text x="286" y="85" fill="#5a6580">WAL READY</text>

          <rect x="268" y="140" width="84" height="12" rx="2" fill="#f5f5f5"/>
          <text x="310" y="149" fill="#5a6580">STATE SYNC</text>

          <rect x="224" y="352" width="112" height="12" rx="2" fill="#f5f5f5"/>
          <text x="280" y="361" fill="#5a6580">UNCERTAIN HEAD</text>

          <rect x="336" y="180" width="116" height="12" rx="2" fill="#f5f5f5"/>
          <text x="394" y="189" fill="#5a6580">SUFFIX REPAIRED</text>

          <rect x="532" y="292" width="96" height="12" rx="2" fill="#f5f5f5"/>
          <text x="580" y="301" fill="#5a6580">GAP OBSERVED</text>

          <rect x="308" y="224" width="88" height="12" rx="2" fill="#f5f5f5"/>
          <text x="352" y="233" fill="#5a6580">RECOVER VC</text>

          <rect x="644" y="76" width="112" height="12" rx="2" fill="#f5f5f5"/>
          <text x="700" y="85" fill="#5a6580">TIMEOUT / VIEW</text>

          <rect x="620" y="140" width="108" height="12" rx="2" fill="#f5f5f5"/>
          <text x="674" y="149" fill="#bf4520">VIEW INSTALLED</text>

          <rect x="620" y="336" width="108" height="12" rx="2" fill="#f5f5f5"/>
          <text x="674" y="345" fill="#5a6580">REPAIR SUFFIX</text>

          <rect x="644" y="396" width="112" height="12" rx="2" fill="#f5f5f5"/>
          <text x="700" y="405" fill="#5a6580">STALLED REPAIR</text>

          <rect x="872" y="208" width="76" height="12" rx="2" fill="#f5f5f5"/>
          <text x="910" y="217" fill="#5a6580">HIGHER VIEW</text>
        </g>

        <!-- Start dot -->
        <circle cx="164" cy="134" r="6" fill="#2d3142"/>

        <!-- State 1: StatusRecovering (left) -->
        <rect x="64" y="200" width="200" height="84" rx="8" fill="#f5f5f5"/>
        <rect x="64" y="200" width="200" height="84" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="72" y="208" width="64" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="104" y="217" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">BOOT / SYNC</text>
        <text x="164" y="246" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">StatusRecovering</text>
        <text x="164" y="264" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">open WAL or state sync</text>

        <!-- State 2: StatusNormal (top-center, FOCAL CORAL) -->
        <rect x="384" y="68" width="216" height="84" rx="8" fill="#f5f5f5"/>
        <rect x="384" y="68" width="216" height="84" rx="8" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="392" y="76" width="44" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="414" y="85" fill="#bf4520" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">ACTIVE</text>
        <text x="492" y="114" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">StatusNormal</text>
        <text x="492" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">replicate + commit ops</text>

        <!-- State 3: StatusRecoveringHead (bottom-center) -->
        <rect x="384" y="332" width="216" height="84" rx="8" fill="#f5f5f5"/>
        <rect x="384" y="332" width="216" height="84" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="392" y="340" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="414" y="349" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">REPAIR</text>
        <text x="492" y="378" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">StatusRecoveringHead</text>
        <text x="492" y="396" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">fetch missing WAL suffix</text>

        <!-- State 4: StatusViewChange (right) -->
        <rect x="672" y="200" width="196" height="84" rx="8" fill="#f5f5f5"/>
        <rect x="672" y="200" width="196" height="84" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="680" y="208" width="52" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="706" y="217" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">FAILOVER</text>
        <text x="770" y="246" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">StatusViewChange</text>
        <text x="770" y="264" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">persist view · JoinView</text>

        <!-- Annotation callout for wildcard state sync -->
        <text x="64" y="456" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">Any mode enters StatusRecovering via beginStateSync when a peer checkpoint is ahead.</text>

        <!-- Legend strip -->
        <line x1="40" y1="484" x2="920" y2="484" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="504" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="520" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="60" y="528" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Steady-state mode</text>

        <rect x="200" y="520" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="220" y="528" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Transition / repair mode</text>

        <rect x="380" y="520" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="400" y="528" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Boot / state sync</text>

        <line x1="532" y1="525" x2="560" y2="525" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="568" y="528" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">View installed</text>

        <line x1="680" y1="525" x2="708" y2="525" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="716" y="528" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Recovery / fallback</text>
      </svg>
    </div>
  </div>
</body>
</html>
