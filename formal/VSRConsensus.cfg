SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTRAINT ConsensusStateConstraint

CONSTANTS
N = 3
Values = {value_a}
Sessions = {session_a}
Requests = {request_1, request_2}
Blocks = {block_a}
Releases = {1, 2}
MaxOps = 2
ViewMax = 1
PipelineMax = 2
ResourceMax = 1
ReplicationQuorumMax = 3
NoChecksum = no_checksum
GenerationMax = 1
NoValue = no_value
ConfigurationID = configuration_a
FrameEpoch = 0
FirstRequest = request_1
SecondRequest = request_2

INVARIANTS
TypeOK
ViewStateInvariant
LogChainInvariant
NoConflictingCommittedOperations
CommittedOperationsAreContiguous
LaterViewsContainCommittedPrefix
PrepareOKImpliesDurableRecoverability
PreparedQuorumIsUnique
ReportRankingIsTotal
SelectedCanonicalPreservesPreparedEvidence
ExecutionIsGaplessAndExactlyOnce
ReplyMatchesCommittedSessionRequest
MembershipAndIdentityInvariant
PrimaryCrashRequiresHigherView
QuorumIntersection

PROPERTIES
RepairDoesNotAdvanceHead
StaleCompletionDoesNotMutateState
CompletedCanonicalIsImmutable
